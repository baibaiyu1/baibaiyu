server:
  port: 3065

spring:
  main:
    web-application-type: none
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: YOUR_PASSWORD
      database: 7
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/gmd_faq_server?useSSL=false&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&serverTimezone=GMT%2B8&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true
    username: root
    password: YOUR_PASSWORD
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000

jwt:
  secret: ${JWT_SECRET:replace-with-your-own-random-secret-at-least-32-bytes}

# shell-proxy远程命令执行代理配置
shell-proxy:
  enabled: false
  base-url: http://localhost:3062

# WebSocket 配置
websocket:
  enabled: true
  base-url: http://localhost:3064

# 心跳上报配置
# Docker 部署时通过环境变量 GMD_FAQ_NODE_ID 配置节点标识，无需在此设置 node-id
heartbeat:
  enabled: true
  console-url: http://YOUR_CONSOLE_HOST:3060
  service-type: RUNTIME
  port: ${server.port}

runtime:
  enabled: false

mybatis-plus:
  # Mapper XML 位置：规范路径 + 兼容路径，两条都必需。
  # 当前源码目录仍为 src/main/java/com/faq/server/main/...（Java 包名已是 com.gmd.faq.server.main），
  # 父 pom 按物理路径复制 src/main/java 下的 *.xml，只配规范路径会导致
  # Mapper XML 加载不到，调用时报 Invalid bound statement (not found)。
  mapper-locations:
    - classpath*:com/gmd/faq/server/main/**/mapper/**/*.xml
    - classpath*:com/faq/server/main/**/mapper/**/*.xml
  type-aliases-package: com.gmd.faq.server.main.**.entity
  global-config:
    db-config:
      id-type: assign_id
      update-strategy: not_null
      insert-strategy: not_null
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    #    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
