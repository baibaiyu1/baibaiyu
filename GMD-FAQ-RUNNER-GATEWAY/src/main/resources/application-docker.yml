server:
  port: ${GATEWAY_RUNNER_PORT:3065}

spring:
  main:
    web-application-type: none
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis}
      database: ${REDIS_DATABASE:7}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:gmd_faq_server}?useSSL=false&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&serverTimezone=GMT%2B8&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

jwt:
  secret: ${JWT_SECRET:replace-with-your-own-random-secret-at-least-32-bytes}

shell-proxy:
  enabled: ${SHELL_PROXY_ENABLED:true}
  base-url: http://${PROXY_HOST:127.0.0.1}:${PROXY_PORT:3062}

websocket:
  enabled: ${WEBSOCKET_ENABLED:false}
  base-url: http://${WEBSOCKET_HOST:127.0.0.1}:${WEBSOCKET_PORT:3064}

heartbeat:
  enabled: true
  console-url: http://${CONSOLE_HOST:127.0.0.1}:3060
  service-type: GATEWAY

runtime:
  enabled: false

mybatis-plus:
  # Mapper XML 位置：规范路径 + 兼容路径，两条都必需。
  # 当前源码目录仍为 src/main/java/com/faq/server/main/...（Java 包名已是 com.gmd.faq.server.main），
  # 父 pom 按物理路径复制 src/main/java 下的 *.xml，只配规范路径会导致
  # Mapper XML 加载不到，调用时报 Invalid bound statement (not found)。
  mapper-locations:
    - classpath*:com/gmd/faq/server/main/**/mapper/**/*.xml
    - classpath*:com/faq/server/main/**/mapper/**/*.xml
  type-aliases-package: com.gmd.faq.server.main.**.entity
  global-config:
    db-config:
      id-type: assign_id
      update-strategy: not_null
      insert-strategy: not_null
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
