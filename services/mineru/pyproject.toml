[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineru"
version = "3.4.5"
description = "MinerU document parsing backend integrated into the GMD platform"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE.md"}
dependencies = [
    "click>=8.1.7",
    "loguru>=0.7.2",
    "numpy>=1.21.6",
    "tqdm>=4.67.1",
    "requests",
    "httpx",
    "pillow>=11.0.0",
    "pypdfium2<6.0.0,>=4.30.0",
    "pypdf>=5.6.0",
    "reportlab",
    "pdftext<0.8.0,>=0.6.3",
    "modelscope>=1.26.0",
    "huggingface-hub>=0.32.4",
    "json-repair>=0.46.2",
    "opencv-python>=4.11.0.86",
    "fast-langdetect<0.3.0,>=0.2.3",
    "openai<3,>=1.70.0",
    "beautifulsoup4<5,>=4.13.5",
    "magika<1.1.0,>=0.6.2",
    "mineru-vl-utils==1.2.1",
    "python-docx<2,>=1.2.0",
    "pypptx-with-oxml<2,>=1.0.3",
    "mammoth<2,>=1.11.0",
    "pylatexenc<3,>=2.10",
    "lxml<7.0.0,>=4.0.0",
    "openpyxl<4,>=3.1.5",
    "fastapi",
    "python-multipart",
    "uvicorn",
]

[project.optional-dependencies]
pipeline = [
    "PyYAML<7,>=6.0.1",
    "ftfy<7,>=6.3.1",
    "shapely<3,>=2.0.7",
    "pyclipper<2,>=1.3.0",
    "torch<3,>=2.6.0",
    "torchvision",
    "transformers<5.0.0,>=4.57.3",
    "safetensors<1,>=0.4.0",
    "onnxruntime>1.17.0",
]

[project.scripts]
mineru = "mineru.cli.client:main"
mineru-api = "mineru.cli.fast_api:main"
mineru-models-download = "mineru.cli.models_download:download_models"

[project.urls]
Repository = "https://github.com/opendatalab/MinerU"

[tool.setuptools.packages.find]
include = ["mineru*"]

[tool.setuptools.package-data]
mineru = ["**/*.yaml", "**/*.yml", "**/*.txt", "resources/fasttext-langdetect/*.ftz"]
