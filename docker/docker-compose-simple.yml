# ============================================================
# 单机体验版（docker-compose-simple.yml）
# 一键启动所有服务 + 中间件，用于快速体验平台
# 使用方式：bash start-simple.sh 或 docker compose -f docker-compose-simple.yml up -d
# 注意：此模式不推荐生产使用
# ============================================================

services:
  # ==================== MySQL ====================
  gmd-faq-mysql:
    image: ${DOCKER_REGISTRY}mysql:8.0
    container_name: gmd-faq-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ${DATA_PATH:-./data}/mysql_data:/var/lib/mysql
      - ../sql/db_init.sql:/docker-entrypoint-initdb.d/db_init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - gmd_faq_simple

  # ==================== Redis ====================
  gmd-faq-redis:
    image: ${DOCKER_REGISTRY}redis:7-alpine
    container_name: gmd-faq-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    command: sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ${DATA_PATH:-./data}/redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gmd_faq_simple

  # ==================== pgvector（向量库） ====================
  gmd-faq-pgvector:
    image: ${DOCKER_REGISTRY}pgvector/pgvector:pg16
    container_name: gmd-faq-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - ${DATA_PATH:-./data}/pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gmd_faq_simple

  # ==================== 管理控制台（runner-console） ====================
  gmd-faq-console:
    build:
      context: ..
      dockerfile: docker/console/Dockerfile
      args:
        MAVEN_IMAGE: ${DOCKER_REGISTRY}maven:3.9-eclipse-temurin-21
        JRE_IMAGE: ${DOCKER_REGISTRY}eclipse-temurin:21-jre
    container_name: gmd-faq-console
    restart: unless-stopped
    # root 运行（业务可信服务，容器隔离承担安全边界），无 cap/security 限制
    mem_limit: ${CONSOLE_MEM_LIMIT:-2g}
    cpus: ${CONSOLE_CPU_LIMIT:-4}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: gmd-faq-mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: gmd-faq-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      CONSOLE_JAVA_HEAP_PERCENTAGE: ${CONSOLE_JAVA_HEAP_PERCENTAGE:-75.0}
      WEBSOCKET_ENABLED: ${WEBSOCKET_ENABLED:-true}
      WEBSOCKET_HOST: ${WEBSOCKET_HOST:-gmd-faq-websocket}
      WEBSOCKET_PORT: ${WEBSOCKET_PORT:-3064}
      # 游客会话（分享链接产生）自动清理：0 = 关闭（默认）。删除会连带删工作空间文件且不可恢复，
      # 因此不默认开启；需要回收时在 .env 里设为保留天数（如 30）。
      GUEST_SESSION_RETENTION_DAYS: ${GUEST_SESSION_RETENTION_DAYS:-0}
      GUEST_SESSION_CLEAN_MAX: ${GUEST_SESSION_CLEAN_MAX:-500}
      TZ: Asia/Shanghai
    volumes:
      - ${LOG_PATH:-./logs}/console:/app/logs
      - ${DATA_PATH:-./data}/.baibaiyu:/app/.baibaiyu
    ports:
      - "3060:3060"
    depends_on:
      gmd-faq-mysql:
        condition: service_healthy
      gmd-faq-redis:
        condition: service_healthy
    networks:
      - gmd_faq_simple

  # ==================== 网关数据面（runner-gateway） ====================
  gmd-faq-gateway:
    build:
      context: ..
      dockerfile: docker/gateway/Dockerfile
      args:
        MAVEN_IMAGE: ${DOCKER_REGISTRY}maven:3.9-eclipse-temurin-21
        JRE_IMAGE: ${DOCKER_REGISTRY}eclipse-temurin:21-jre
    container_name: gmd-faq-gateway
    restart: unless-stopped
    network_mode: host
    mem_limit: ${GATEWAY_MEM_LIMIT:-4g}
    cpus: ${GATEWAY_CPU_LIMIT:-4}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      CONSOLE_HOST: 127.0.0.1
      PROXY_HOST: 127.0.0.1
      PROXY_PORT: "3062"
      GATEWAY_ENABLED: "true"
      GATEWAY_JAVA_HEAP_PERCENTAGE: ${GATEWAY_JAVA_HEAP_PERCENTAGE:-75.0}
      GMD_FAQ_NODE_ID: ${GMD_FAQ_NODE_ID:-gateway-simple}
      GMD_FAQ_HOST_NAME: ${GMD_FAQ_HOST_NAME}
      GMD_FAQ_HOST_IP: ${GMD_FAQ_HOST_IP}
      TZ: Asia/Shanghai
    volumes:
      - ${LOG_PATH:-./logs}/gateway:/app/logs
      - ${DATA_PATH:-./data}/.baibaiyu:/app/.baibaiyu
      - ${DATA_PATH:-./data}/runtime-tools:/opt/tools
    depends_on:
      gmd-faq-mysql:
        condition: service_healthy
      gmd-faq-redis:
        condition: service_healthy
      gmd-faq-proxy:
        condition: service_started

  # ==================== AI 运行时（runner-runtime） ====================
  gmd-faq-runtime:
    build:
      context: ..
      dockerfile: docker/runtime/Dockerfile
      args:
        MAVEN_IMAGE: ${DOCKER_REGISTRY}maven:3.9-eclipse-temurin-21
        JRE_IMAGE: ${DOCKER_REGISTRY}eclipse-temurin:21-jre
    container_name: gmd-faq-runtime
    restart: unless-stopped
    # root 运行（业务可信服务，容器隔离承担安全边界），无 cap/security 限制
    mem_limit: ${RUNTIME_MEM_LIMIT:-4g}
    cpus: ${RUNTIME_CPU_LIMIT:-4}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      GATEWAY_ENABLED: "false"
      MYSQL_HOST: gmd-faq-mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: gmd-faq-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      VECTOR_STORE_TYPE: ${VECTOR_STORE_TYPE}
      PG_HOST: gmd-faq-pgvector
      PG_PORT: "5432"
      PG_DATABASE: ${PG_DATABASE}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      SHELL_PROXY_ENABLED: "true"
      PROXY_HOST: gmd-faq-proxy
      PROXY_PORT: "3062"
      CONSOLE_HOST: gmd-faq-console
      RUNTIME_JAVA_HEAP_PERCENTAGE: ${RUNTIME_JAVA_HEAP_PERCENTAGE:-75.0}
      GMD_VOICE_SERVER_URL: ${GMD_VOICE_SERVER_URL:-ws://127.0.0.1:7880}
      GMD_VOICE_API_KEY: ${GMD_VOICE_API_KEY:-}
      GMD_VOICE_API_SECRET: ${GMD_VOICE_API_SECRET:-}
      GMD_VOICE_AGENT_NAME: ${GMD_VOICE_AGENT_NAME:-gmd-faq-voice}
      MODEL_CHAT_READ_TIMEOUT_SECONDS: ${MODEL_CHAT_READ_TIMEOUT_SECONDS:-600}
      TOOL_EXECUTION_TIMEOUT_SECONDS: ${TOOL_EXECUTION_TIMEOUT_SECONDS:-360}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      BOCHA_API_URL: ${BOCHA_API_URL:-https://api.bocha.cn/v1/web-search}
      BOCHA_TIMEOUT_SECONDS: ${BOCHA_TIMEOUT_SECONDS:-20}
      BOCHA_MAX_RESULTS: ${BOCHA_MAX_RESULTS:-10}
      WEBSOCKET_ENABLED: ${WEBSOCKET_ENABLED:-true}
      WEBSOCKET_HOST: ${WEBSOCKET_HOST:-gmd-faq-websocket}
      WEBSOCKET_PORT: ${WEBSOCKET_PORT:-3064}
      WORKSPACE_CAPACITY_MB: ${WORKSPACE_CAPACITY_MB:-30}
      TOOL_IMAGE_ALLOWED_HOSTS: ${TOOL_IMAGE_ALLOWED_HOSTS:-}
      GMD_FAQ_NODE_ID: ${GMD_FAQ_NODE_ID}
      GMD_FAQ_HOST_NAME: ${GMD_FAQ_HOST_NAME}
      GMD_FAQ_HOST_IP: ${GMD_FAQ_HOST_IP}
      # Python/Node 依赖安装落盘目录（容器重建后依赖持久化）
      PIP_TARGET: /opt/tools/pylib
      PYTHONPATH: /opt/tools/pylib
      NPM_CONFIG_PREFIX: /opt/tools/npm-global
      TZ: Asia/Shanghai
    volumes:
      - ${LOG_PATH:-./logs}/runtime:/app/logs
      - ${DATA_PATH:-./data}/.baibaiyu:/app/.baibaiyu
      - ${DATA_PATH:-./data}/runtime-tools:/opt/tools
    # 发布到宿主机：ui/vite.config.ts 的本地开发代理直连 127.0.0.1:3061
    # （/api/runtime/ → runtime，去掉 /api 前缀后为 /runtime/agui/...）。
    # 与同文件中 console 3060 / proxy 3062 / websocket 3064 / frontend 80 保持一致。
    ports:
      - "3061:3061"
    depends_on:
      gmd-faq-mysql:
        condition: service_healthy
      gmd-faq-redis:
        condition: service_healthy
      gmd-faq-pgvector:
        condition: service_healthy
    networks:
      - gmd_faq_simple

  # ==================== Shell 执行代理（runner-proxy） ====================
  gmd-faq-proxy:
    build:
      context: ..
      dockerfile: docker/proxy/Dockerfile
      args:
        MAVEN_IMAGE: ${DOCKER_REGISTRY}maven:3.9-eclipse-temurin-21
        JRE_IMAGE: ${DOCKER_REGISTRY}eclipse-temurin:21-jre
    container_name: gmd-faq-proxy
    restart: unless-stopped
    # 安全加固：Shell 代理执行不可信命令，必须严格限制
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:exec
    working_dir: /tmp
    mem_limit: ${SHELLPROXY_MEM_LIMIT:-1g}
    cpus: ${SHELLPROXY_CPU_LIMIT:-2}
    pids_limit: ${SHELLPROXY_PIDS_LIMIT:-200}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-Djava.io.tmpdir=/tmp -Dspring.pid.file="
      CONSOLE_HOST: gmd-faq-console
      SHELL_DEFAULT_TIMEOUT: ${SHELLPROXY_DEFAULT_TIMEOUT:-300}
      SHELL_MAX_TIMEOUT: ${SHELLPROXY_MAX_TIMEOUT:-3600}
      SHELL_MAX_OUTPUT_SIZE: ${SHELLPROXY_MAX_OUTPUT_SIZE:-52428800}
      SHELLPROXY_JAVA_HEAP_PERCENTAGE: ${SHELLPROXY_JAVA_HEAP_PERCENTAGE:-50.0}
      # Python/Node 依赖安装落盘目录（read_only 根文件系统下唯一持久化可写点）
      PIP_TARGET: /opt/tools/pylib
      PYTHONPATH: /opt/tools/pylib
      NPM_CONFIG_PREFIX: /opt/tools/npm-global
      GMD_FAQ_NODE_ID: ${GMD_FAQ_NODE_ID}
      GMD_FAQ_HOST_NAME: ${GMD_FAQ_HOST_NAME}
      GMD_FAQ_HOST_IP: ${GMD_FAQ_HOST_IP}
      TZ: Asia/Shanghai
    volumes:
      - ${LOG_PATH:-./logs}/proxy:/app/logs
      - ${DATA_PATH:-./data}/.baibaiyu:/app/.baibaiyu
      - ${DATA_PATH:-./data}/proxy-tools:/opt/tools
    ports:
      - "3062:3062"
    networks:
      - gmd_faq_simple

  # ==================== WebSocket 推送服务（runner-websocket） ====================
  gmd-faq-websocket:
    build:
      context: ..
      dockerfile: docker/websocket/Dockerfile
      args:
        MAVEN_IMAGE: ${DOCKER_REGISTRY}maven:3.9-eclipse-temurin-21
        JRE_IMAGE: ${DOCKER_REGISTRY}eclipse-temurin:21-jre
    container_name: gmd-faq-websocket
    restart: unless-stopped
    mem_limit: ${WEBSOCKET_MEM_LIMIT:-1g}
    cpus: ${WEBSOCKET_CPU_LIMIT:-2}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: gmd-faq-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE}
      CONSOLE_HOST: ${CONSOLE_HOST:-gmd-faq-console}
      WEBSOCKET_JAVA_HEAP_PERCENTAGE: ${WEBSOCKET_JAVA_HEAP_PERCENTAGE:-50.0}
      TZ: Asia/Shanghai
    ports:
      - "${WEBSOCKET_PORT:-3064}:3064"
    depends_on:
      gmd-faq-redis:
        condition: service_healthy
    networks:
      - gmd_faq_simple

  # ==================== 前端（Nginx） ====================
  gmd-faq-frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        NODE_IMAGE: ${DOCKER_REGISTRY}node:22
        NGINX_IMAGE: ${DOCKER_REGISTRY}nginx:alpine
        VITE_APP_BASE_API: ${VITE_APP_BASE_API}
        VITE_APP_CONTEXT_PATH: ${VITE_APP_CONTEXT_PATH}
    container_name: gmd-faq-frontend
    restart: unless-stopped
    # nginx.conf 使用 envsubst 替换 runtime 地址变量
    environment:
      RUNTIME_HOST: gmd-faq-runtime
      RUNTIME_PORT: "3061"
      WEBSOCKET_HOST: gmd-faq-websocket
      WEBSOCKET_PORT: "3064"
    entrypoint: >
      /bin/sh -c "
        envsubst '$$RUNTIME_HOST $$RUNTIME_PORT $$WEBSOCKET_HOST $$WEBSOCKET_PORT' < /etc/nginx/conf.d/default.conf > /etc/nginx/conf.d/default.conf.tmp &&
        mv /etc/nginx/conf.d/default.conf.tmp /etc/nginx/conf.d/default.conf &&
        nginx -g 'daemon off;'
      "
    volumes:
      - ${LOG_PATH:-./logs}/frontend:/var/log/nginx
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - gmd-faq-console
      - gmd-faq-runtime
    networks:
      - gmd_faq_simple

networks:
  gmd_faq_simple:
    name: gmd_faq_simple
    driver: bridge
