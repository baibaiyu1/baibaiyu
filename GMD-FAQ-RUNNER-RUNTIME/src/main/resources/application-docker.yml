# ============================================================
# Docker 环境配置（spring.profiles.active=docker）
# 所有值均从环境变量读取，由 docker-compose 注入
# ============================================================

server:
  port: 3061

# 执行节点存储模式：代码侧读取的是 gmd.faq.storage-mode
# （WorkspaceSyncService 的 @ConditionalOnProperty，见 docker/README.md「多节点部署与存储模式」）。
# GMD_FAQ_STORAGE_MODE 可选择 shared 共享存储或 local 节点本地存储。
gmd:
  faq:
    storage-mode: ${GMD_FAQ_STORAGE_MODE:shared}
    model:
      chat-read-timeout-seconds: ${MODEL_CHAT_READ_TIMEOUT_SECONDS:600}
    tool:
      execution-timeout-seconds: ${TOOL_EXECUTION_TIMEOUT_SECONDS:360}

agentscope:
  agui:
    path-prefix: /runtime/agui
    cors-enabled: true
    enable-reasoning: true
    server-side-memory: true
    max-thread-sessions: 1000

spring:
  data:
    redis:
      host: ${REDIS_HOST:gmd-faq-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis}
      database: ${REDIS_DATABASE:7}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:gmd-faq-mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:gmd_faq_server}?useSSL=false&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&serverTimezone=GMT%2B8&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000

jwt:
  secret: ${JWT_SECRET:replace-with-your-own-random-secret-at-least-32-bytes}

# shell-proxy 远程命令执行代理配置
shell-proxy:
  enabled: ${SHELL_PROXY_ENABLED:true}
  base-url: http://${PROXY_HOST:gmd-faq-proxy}:${PROXY_PORT:3062}

# WebSocket 配置
websocket:
  enabled: ${WEBSOCKET_ENABLED:true}
  base-url: http://${WEBSOCKET_HOST:gmd-faq-websocket}:${WEBSOCKET_PORT:3064}

# RAG 相关配置
rag:
  store: ${VECTOR_STORE_TYPE:pgvector}
  pgvector:
    url: jdbc:postgresql://${PG_HOST:gmd-faq-pgvector}:${PG_PORT:5432}/${PG_DATABASE:gmd_faq_vector}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  milvus:
    host: ${MILVUS_HOST:milvus}
    port: ${MILVUS_PORT:19530}
    username:
    password:
    token:
    database: ${MILVUS_DATABASE:default}
  qdrant:
    host: ${QDRANT_HOST:qdrant}
    port: ${QDRANT_PORT:6334}
    api-key:
    collection-prefix: gmd_faq_rag
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://gmd-faq-elasticsearch:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    api-key: ${ELASTICSEARCH_API_KEY:}
    index-prefix: ${ELASTICSEARCH_INDEX_PREFIX:gmd_faq_rag}
    connect-timeout: ${ELASTICSEARCH_CONNECT_TIMEOUT:5000}
    socket-timeout: ${ELASTICSEARCH_SOCKET_TIMEOUT:60000}
  weaviate:
    host: ${WEAVIATE_HOST:weaviate}
    port: ${WEAVIATE_PORT:8080}
    scheme: ${WEAVIATE_SCHEME:http}
    api-key: ${WEAVIATE_API_KEY:}
    class-prefix: ${WEAVIATE_CLASS_PREFIX:BaibaiyuRag}

mybatis-plus:
  # Mapper XML 位置：规范路径 + 兼容路径，两条都必需。
  # 当前源码目录仍为 src/main/java/com/faq/server/main/...（Java 包名已是 com.gmd.faq.server.main），
  # 父 pom 按物理路径复制 src/main/java 下的 *.xml，只配规范路径会导致
  # Mapper XML 加载不到，调用时报 Invalid bound statement (not found)。
  mapper-locations:
    - classpath*:com/gmd/faq/server/main/**/mapper/**/*.xml
    - classpath*:com/faq/server/main/**/mapper/**/*.xml
  type-aliases-package: com.gmd.faq.server.main.**.entity
  global-config:
    db-config:
      id-type: assign_id
      update-strategy: not_null
      insert-strategy: not_null
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true

# 心跳上报配置
heartbeat:
  enabled: true
  console-url: http://${CONSOLE_HOST:gmd-faq-console}:3060
  service-type: RUNTIME
  port: ${server.port}
