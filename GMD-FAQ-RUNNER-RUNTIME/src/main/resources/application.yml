spring:
  profiles:
    active: dev
  application:
    name: gmd-faq-runtime
  servlet:
    multipart:
      max-file-size: 30MB # 单个文件最大 30MB
      max-request-size: 100MB # 请求总大小最大 100MB（假设最多3个30MB文件）
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

gmd:
  faq:
    web-search:
      bocha:
        api-key: ${BOCHA_API_KEY:}
        api-url: ${BOCHA_API_URL:https://api.bocha.cn/v1/web-search}
        timeout-seconds: ${BOCHA_TIMEOUT_SECONDS:20}
        max-results: ${BOCHA_MAX_RESULTS:10}
